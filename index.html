<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScapeMaker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
  />
  <!-- Styles come in through main.ts, which is what Vite bundles and
       fingerprints; the source-path <link>s that used to sit here were
       redundant (Vite folded them into the same bundle). What is left is just
       enough inline to avoid a flash of white before that bundle lands — the
       real values live in tokens.css and take over the moment it does. -->
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #0d1117; color: #dce4ec; }        /* --bg / --text, dark */
    html[data-theme='light'] body { background: #f6f8fa; color: #17202a; }
  </style>
</head>
<body>
  <div id="app" aria-busy="true"></div>
  <div id="unsupported" hidden>
    <p>
      ScapeMaker needs a window at least 1024&nbsp;px wide — a timeline, a
      source panel and an inspector do not fit in less. Widen this window, or
      open it on a laptop or desktop display, and it will come straight back.
      Nothing you have done is lost.
    </p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
